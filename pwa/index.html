<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Tahta Kilit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 1. Ana ekran -->
<section id="view-home" class="view" hidden>
  <header class="ust">
    <h1 class="brand">Tahta Kilit</h1>
  </header>
  <div class="pad">
    <button id="ac-btn" class="btn kocaman" type="button">Tahta aç</button>
    <p class="hint orta">Tahtadaki karekodu okut</p>
    <button id="elle-btn" class="btn sade" type="button">Kamera çalışmıyor mu? Kodu elle gir</button>
  </div>
</section>

<!-- 2. Kamera -->
<section id="view-scan" class="view kamera" hidden>
  <video id="kamera" playsinline muted></video>
  <canvas id="tuval" hidden></canvas>
  <div class="hedef"></div>
  <div class="kamera-alt">
    <p class="kamera-yazi">Tahtadaki karekodu okut</p>
    <p id="scan-hata" class="hata" role="alert" hidden></p>
    <button id="scan-elle" class="btn sade acik" type="button">Kodu elle gir</button>
    <button id="scan-iptal" class="btn sade acik" type="button">Vazgeç</button>
  </div>
</section>

<!-- 3. Elle kod girme -->
<section id="view-manual" class="view" hidden>
  <header class="ust">
    <button class="ikon" type="button" data-geri>‹</button>
    <h1 class="brand">Kodu elle gir</h1>
  </header>
  <div class="pad">
    <form id="manual-form" autocomplete="off">
      <label class="etiket" for="manual-kod">Tahtadaki 12 haneli sayı</label>
      <input id="manual-kod" class="kod" type="text" inputmode="numeric"
             pattern="[0-9 ]*" spellcheck="false" maxlength="17"
             placeholder="1234 5665 4321" required>

      <p id="manual-hata" class="hata" role="alert" hidden></p>
      <button class="btn birincil" type="submit">Şifreyi üret</button>
    </form>
  </div>
</section>

<!-- 4. Sonuc -->
<section id="view-result" class="view" hidden>
  <div class="pad orta-dikey">
    <p class="hint orta">Bu şifreyi tahtaya gir</p>
    <p id="sonuc-kod" class="sifre"></p>
    <p class="hint orta kucuk">Tahtadaki sayı 30 saniyede bir değişir.
      Şifre kabul edilmezse karekodu yeniden okut.</p>
    <button id="sonuc-bitti" class="btn birincil" type="button">Bitti</button>
  </div>
</section>

<script src="vendor/jsQR.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
